<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Links | Evoluindo no Amor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { colors: { brand: { 50: '#fff1f2', 100: '#ffe4e6', 500: '#f43f5e', 600: '#e11d48', 700: '#be123c' } } }
            }
        }
    </script>
    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/60 sticky top-0 z-30 backdrop-blur-md">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-600 p-2 rounded-xl shadow-lg shadow-brand-600/30">
                    <i data-lucide="link-2" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg sm:text-xl tracking-tight text-white">PrettyLinks <span class="text-brand-500">GitHub</span></h1>
                    <p class="text-xs text-slate-400">Painel Oficial • Projeto Casamento Feliz</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <span id="connection-badge" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20">
                    <span class="w-2 h-2 rounded-full bg-amber-400 mr-2 animate-pulse"></span>
                    Configuração Pendente
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 flex-grow w-full grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column (Configs & Generator) -->
        <div class="lg:col-span-7 space-y-6">
            
            <!-- Card 1: GitHub Connection -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center space-x-2">
                        <i data-lucide="key-round" class="w-5 h-5 text-brand-500"></i>
                        <h2 class="text-base font-semibold text-white">1. Conexão com seu GitHub</h2>
                    </div>
                </div>

                <div id="config-section" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Usuário GitHub</label>
                            <input type="text" id="gh-owner" value="evoluindonoamor" oninput="updatePreviewAndSave()" 
                                class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Nome do Repositório</label>
                            <input type="text" id="gh-repo" value="evoluindonoamor.github.io" oninput="updatePreviewAndSave()" 
                                class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500 transition">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Token de Acesso Pessoal</label>
                        <input type="password" id="gh-token" oninput="updatePreviewAndSave()" 
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500 transition"
                            placeholder="ghp_...">
                    </div>
                </div>
            </div>

            <!-- Card 2: Link Generator -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl relative overflow-hidden">
                <div class="flex items-center space-x-2 mb-5">
                    <i data-lucide="zap" class="w-5 h-5 text-brand-500"></i>
                    <h2 class="text-lg font-bold text-white">2. Criar Link Curto</h2>
                </div>

                <!-- Redes Sociais (Com opção de excluir) -->
                <div class="mb-5 bg-slate-950/60 border border-slate-800/80 rounded-xl p-3.5">
                    <div class="flex items-center justify-between mb-2.5">
                        <label class="block text-xs font-medium text-slate-300">Atalhos de Redes Sociais:</label>
                        <button type="button" onclick="toggleAddNetworkTab()" class="text-xs text-brand-400 hover:text-brand-300 font-semibold flex items-center space-x-1 bg-brand-500/10 border border-brand-500/20 px-2.5 py-1 rounded-lg">
                            <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> <span>+ Nova Rede</span>
                        </button>
                    </div>

                    <div id="networks-buttons-container" class="flex flex-wrap gap-2">
                        <!-- Renderizado via JS -->
                    </div>

                    <!-- Aba Cadastrar Nova Rede -->
                    <div id="add-network-tab" class="hidden mt-3 pt-3 border-t border-slate-800 space-y-3">
                        <div class="grid grid-cols-1 sm:grid-cols-12 gap-2">
                            <div class="sm:col-span-3">
                                <input type="text" id="new-net-emoji" placeholder="Emoji" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-2 text-xs text-white">
                            </div>
                            <div class="sm:col-span-5">
                                <input type="text" id="new-net-name" placeholder="Nome (ex: Kwai)" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white">
                            </div>
                            <div class="sm:col-span-4">
                                <button type="button" onclick="addCustomNetwork()" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-semibold rounded-lg text-xs py-2 px-3">Adicionar</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Slug Final (Nome após a barra)</label>
                        <div class="flex items-center bg-slate-950 border border-slate-800 rounded-xl overflow-hidden focus-within:border-brand-500">
                            <span id="domain-prefix" class="px-3 py-2.5 bg-slate-900 text-slate-400 text-xs sm:text-sm border-r border-slate-800 font-mono">
                                evoluindonoamor.github.io/
                            </span>
                            <input type="text" id="link-slug" oninput="sanitizeSlug(); updatePreviewAndSave();" class="w-full bg-transparent px-3.5 py-2.5 text-sm text-white font-mono outline-none" placeholder="tiktok">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Link Kiwify (Com rastreio)</label>
                        <input type="url" id="link-target" oninput="updatePreviewAndSave()" value="https://pay.kiwify.com.br/ALu3sst?src=tiktok" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-emerald-300 font-mono focus:border-brand-500 outline-none">
                    </div>

                    <button type="button" id="submit-btn" onclick="createOrUpdateShortlink()" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-semibold py-3.5 px-6 rounded-xl transition flex items-center justify-center space-x-2">
                        <i data-lucide="rocket" class="w-5 h-5"></i> <span>Criar e Publicar Link no GitHub</span>
                    </button>
                    <div id="status-box" class="hidden rounded-xl p-4 text-sm border"></div>
                </div>
            </div>
        </div>

        <!-- Right Column (History) -->
        <div class="lg:col-span-5 flex flex-col">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex-grow flex flex-col">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-base font-bold text-white flex items-center gap-2"><i data-lucide="folder-git-2" class="w-5 h-5 text-brand-500"></i> Links Ativos</h2>
                    <button onclick="loadExistingLinks()" class="px-2.5 py-1.5 bg-slate-800 text-slate-300 rounded-lg text-xs font-medium border border-slate-700">Sincronizar</button>
                </div>
                <p class="text-xs text-slate-400 mb-4">Ao apagar um link aqui, ele é excluído do seu GitHub na hora.</p>
                <div id="links-list" class="space-y-2.5 overflow-y-auto max-h-[500px] pr-1"></div>
            </div>
        </div>
    </main>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 border border-slate-700 text-white px-4 py-3 rounded-xl shadow-2xl text-sm font-medium transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center space-x-2">
        <span id="toast-msg">Sucesso!</span>
    </div>

    <script>
        lucide.createIcons();

        const STORAGE_KEYS = { OWNER: 'pl_gh_owner', REPO: 'pl_gh_repo', TOKEN: 'pl_gh_token', HISTORY: 'pl_links_history', NETWORKS: 'pl_custom_networks' };
        const DEFAULT_NETWORKS = [{ emoji: '🎵', name: 'TikTok', slug: 'tiktok' }, { emoji: '📸', name: 'Instagram', slug: 'instagram' }, { emoji: '▶️', name: 'YouTube', slug: 'youtube' }];

        window.addEventListener('DOMContentLoaded', () => {
            const savedOwner = localStorage.getItem(STORAGE_KEYS.OWNER);
            const savedRepo = localStorage.getItem(STORAGE_KEYS.REPO);
            const savedToken = localStorage.getItem(STORAGE_KEYS.TOKEN);

            if (savedOwner) document.getElementById('gh-owner').value = savedOwner;
            if (savedRepo) document.getElementById('gh-repo').value = savedRepo;
            if (savedToken) document.getElementById('gh-token').value = savedToken;

            renderNetworksButtons();
            updatePreviewAndSave();
            renderSavedHistory();
            if (savedToken) loadExistingLinks();
        });

        function getNetworksList() {
            const saved = localStorage.getItem(STORAGE_KEYS.NETWORKS);
            return saved ? JSON.parse(saved) : DEFAULT_NETWORKS;
        }

        function renderNetworksButtons() {
            const container = document.getElementById('networks-buttons-container');
            const networks = getNetworksList();
            container.innerHTML = networks.map(net => `
                <div class="inline-flex items-center bg-slate-900 border border-slate-700/80 rounded-lg overflow-hidden group">
                    <button type="button" onclick="setQuickPreset('${net.slug}')" class="px-3 py-1.5 text-xs font-medium text-slate-200 hover:bg-slate-800">
                        ${net.emoji} ${net.name}
                    </button>
                    <button type="button" onclick="removeCustomNetwork('${net.slug}')" class="px-2 py-1.5 text-slate-500 hover:bg-rose-500/20 hover:text-rose-400 text-xs transition" title="Apagar Rede">
                        ×
                    </button>
                </div>
            `).join('');
        }

        function toggleAddNetworkTab() {
            document.getElementById('add-network-tab').classList.toggle('hidden');
        }

        function addCustomNetwork() {
            const emoji = document.getElementById('new-net-emoji').value || '🔗';
            const name = document.getElementById('new-net-name').value.trim();
            const slug = name.toLowerCase().replace(/[^a-z0-9]/g, '');
            if(!name) return showToast('Preencha o nome!');
            
            const networks = getNetworksList();
            networks.push({ emoji, name, slug });
            localStorage.setItem(STORAGE_KEYS.NETWORKS, JSON.stringify(networks));
            renderNetworksButtons();
            toggleAddNetworkTab();
            setQuickPreset(slug);
        }

        function removeCustomNetwork(slug) {
            let networks = getNetworksList();
            networks = networks.filter(n => n.slug !== slug);
            localStorage.setItem(STORAGE_KEYS.NETWORKS, JSON.stringify(networks));
            renderNetworksButtons();
        }

        function sanitizeSlug() {
            const input = document.getElementById('link-slug');
            input.value = input.value.toLowerCase().replace(/[^a-z0-9-_]/g, '');
        }

        function updatePreviewAndSave() {
            const owner = document.getElementById('gh-owner').value.trim();
            const repo = document.getElementById('gh-repo').value.trim();
            const token = document.getElementById('gh-token').value.trim();
            
            localStorage.setItem(STORAGE_KEYS.OWNER, owner);
            localStorage.setItem(STORAGE_KEYS.REPO, repo);
            if(token) localStorage.setItem(STORAGE_KEYS.TOKEN, token);

            const baseDomain = repo.toLowerCase().endsWith('.github.io') ? repo.toLowerCase() : `${owner.toLowerCase()}.github.io/${repo.toLowerCase()}`;
            document.getElementById('domain-prefix').innerText = `${baseDomain}/`;
            
            const badge = document.getElementById('connection-badge');
            if (token && owner && repo) {
                badge.className = "inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 mr-2"></span>Conectado`;
            }
        }

        function setQuickPreset(network) {
            document.getElementById('link-slug').value = network;
            document.getElementById('link-target').value = `https://pay.kiwify.com.br/ALu3sst?src=${network}`;
            updatePreviewAndSave();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2500);
        }

        function showStatus(type, html) {
            const box = document.getElementById('status-box');
            box.className = `rounded-xl p-4 text-sm border ${type === 'success' ? 'bg-emerald-950/60 border-emerald-600/50 text-emerald-200' : 'bg-rose-950/60 border-rose-600/50 text-rose-200'}`;
            box.innerHTML = html;
            box.classList.remove('hidden');
        }

        async function createOrUpdateShortlink() {
            const owner = document.getElementById('gh-owner').value.trim();
            const repo = document.getElementById('gh-repo').value.trim();
            const token = document.getElementById('gh-token').value.trim();
            const slug = document.getElementById('link-slug').value.trim();
            const targetUrl = document.getElementById('link-target').value.trim();

            if (!token || !slug || !targetUrl) return showStatus('error', 'Preencha todos os campos!');

            const redirectHtml = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Redirecionando...</title><meta http-equiv="refresh" content="0; url=${targetUrl}"><script>window.location.replace("${targetUrl}");<\/script></head><body><p>Redirecionando... <a href="${targetUrl}">Clique aqui</a>.</p></body></html>`;
            const contentBase64 = btoa(unescape(encodeURIComponent(redirectHtml)));
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${slug}/index.html`;

            document.getElementById('submit-btn').disabled = true;
            try {
                let existingSha = null;
                const checkRes = await fetch(apiUrl, { headers: { 'Authorization': `token ${token}` } });
                if (checkRes.ok) existingSha = (await checkRes.json()).sha;

                const payload = { message: `Link /${slug}`, content: contentBase64 };
                if (existingSha) payload.sha = existingSha;

                const putRes = await fetch(apiUrl, { method: 'PUT', headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });

                if (putRes.ok || putRes.status === 201) {
                    const shortUrl = repo.toLowerCase().endsWith('.github.io') ? `https://${repo}/${slug}` : `https://${owner}.github.io/${repo}/${slug}`;
                    saveToHistory(slug, shortUrl, targetUrl);
                    showStatus('success', `✅ Link Publicado: <a href="${shortUrl}" target="_blank" class="underline">${shortUrl}</a>`);
                    showToast('Link Criado!');
                } else {
                    showStatus('error', '❌ Erro ao salvar no GitHub.');
                }
            } catch (e) {
                showStatus('error', `❌ Erro: ${e.message}`);
            }
            document.getElementById('submit-btn').disabled = false;
        }

        function saveToHistory(slug, shortUrl, targetUrl) {
            let history = JSON.parse(localStorage.getItem(STORAGE_KEYS.HISTORY) || '[]');
            history = history.filter(i => i.slug !== slug);
            history.unshift({ slug, shortUrl, targetUrl });
            localStorage.setItem(STORAGE_KEYS.HISTORY, JSON.stringify(history));
            renderSavedHistory();
        }

        function renderSavedHistory() {
            const listEl = document.getElementById('links-list');
            const history = JSON.parse(localStorage.getItem(STORAGE_KEYS.HISTORY) || '[]');
            if (history.length === 0) return listEl.innerHTML = '<div class="text-slate-500 text-center py-4 text-sm">Nenhum link.</div>';

            listEl.innerHTML = history.map(item => `
                <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 flex justify-between items-center group">
                    <div class="overflow-hidden">
                        <div class="text-brand-400 font-mono text-sm font-bold">/${item.slug}</div>
                        <div class="text-xs text-slate-500 truncate mt-1">${item.targetUrl}</div>
                    </div>
                    <div class="flex gap-1 ml-2">
                        <button onclick="navigator.clipboard.writeText('${item.shortUrl}'); showToast('Copiado!')" class="p-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg transition" title="Copiar"><i data-lucide="copy" class="w-4 h-4"></i></button>
                        <button onclick="deleteLink('${item.slug}')" class="p-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 rounded-lg transition" title="Apagar Pasta do GitHub"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        async function deleteLink(slug) {
            if(!confirm(`Apagar o link /${slug} do GitHub para sempre?`)) return;
            const owner = document.getElementById('gh-owner').value.trim();
            const repo = document.getElementById('gh-repo').value.trim();
            const token = document.getElementById('gh-token').value.trim();
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${slug}/index.html`;

            try {
                const checkRes = await fetch(apiUrl, { headers: { 'Authorization': `token ${token}` } });
                if (checkRes.ok) {
                    const sha = (await checkRes.json()).sha;
                    await fetch(apiUrl, { method: 'DELETE', headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ message: `Deletando /${slug}`, sha }) });
                }
                let history = JSON.parse(localStorage.getItem(STORAGE_KEYS.HISTORY) || '[]');
                localStorage.setItem(STORAGE_KEYS.HISTORY, JSON.stringify(history.filter(i => i.slug !== slug)));
                renderSavedHistory();
                showToast(`/${slug} apagado!`);
            } catch (e) {
                showToast('Erro ao apagar.');
            }
        }

        async function loadExistingLinks() {
            const owner = document.getElementById('gh-owner').value.trim();
            const repo = document.getElementById('gh-repo').value.trim();
            const token = document.getElementById('gh-token').value.trim();
            if(!token) return;
            
            try {
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents`, { headers: { 'Authorization': `token ${token}` } });
                if (res.ok) {
                    const items = await res.json();
                    let history = JSON.parse(localStorage.getItem(STORAGE_KEYS.HISTORY) || '[]');
                    
                    items.filter(i => i.type === 'dir' && !i.name.startsWith('.')).forEach(dir => {
                        if (!history.some(h => h.slug === dir.name)) {
                            const shortUrl = repo.toLowerCase().endsWith('.github.io') ? `https://${repo}/${dir.name}` : `https://${owner}.github.io/${repo}/${dir.name}`;
                            history.push({ slug: dir.name, shortUrl: shortUrl, targetUrl: 'Ativo no GitHub' });
                        }
                    });
                    localStorage.setItem(STORAGE_KEYS.HISTORY, JSON.stringify(history));
                    renderSavedHistory();
                    showToast('Sincronizado!');
                }
            } catch (e) {}
        }
    </script>
</body>
</html>
